# Cargo configuration shared by the repository's standalone Rust tooling.
#
# The scanner runtime is compiled from Forge Web Script sources; this file does
# not define or package a Rust scanner artifact.

[build]
# Emit all build artifacts under the workspace-root `target/` directory.
target-dir = "target"

[env]
# `shadow-rs`'s (host-side) `git2` build backend pulls in `libgit2-sys`, whose
# default probe can record a stale, version-specific Homebrew Cellar path
# (e.g. `.../libgit2/<old-version>/lib`). After a system `libgit2` upgrade that
# directory no longer exists, so build-script linking fails with
# `ld: library 'git2' not found`. Forcing the pkg-config resolver makes it query
# the installed `libgit2` afresh on every build, keeping the link path correct
# and deterministic across environments.
LIBGIT2_SYS_USE_PKG_CONFIG = "1"

[term]
color = "always"

[net]
git-fetch-with-cli = true
