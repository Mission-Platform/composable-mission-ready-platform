[package]
name = "mission-platform-pdf417-decode"
version = "0.1.0"
edition = "2021"
description = "PDF417 decoder compiled to WebAssembly for @mission-platform/code-scanner"
license = "MIT"
publish = false

[lib]
# `cdylib` for the shipped wasm; `rlib` so the crate can also be unit-tested
# natively with `cargo test`.
crate-type = ["cdylib", "rlib"]

[features]
# The crate's own wasm build ships the `wasm-bindgen` `decode` export, so
# `wasm-api` is on by default. Consumers that link this crate into another cdylib
# (e.g. `mission-platform-code-scan`) depend with `default-features = false` so
# the duplicate `decode`/`start` exports are dropped and only the dependency-free
# codeword-decode entry points are compiled.
default = ["wasm-api"]
# Emit the `wasm-bindgen` `decode` (and `start`) exports. Off when the crate is
# used purely as a native/rlib decode library.
wasm-api = []
# Optional in-browser diagnostics: compile in a `tracing-wasm` subscriber and a
# panic hook. Implies `wasm-api`.
console = [
    "wasm-api",
    "dep:tracing-wasm",
    "dep:mission-platform-console-panic-hook",
]

[dependencies]
mission-platform-pdf417-common.workspace = true
wasm-bindgen.workspace = true
tracing = { workspace = true }
tracing-wasm = { workspace = true, optional = true }
mission-platform-console-panic-hook = { workspace = true, optional = true }

[dev-dependencies]
# In-crate wasm-bindgen tests run under `wasm-pack test`.
wasm-bindgen-test.workspace = true

# The round-trip tests encode a payload with the sibling encoder and decode it
# back. The encoder exports its own wasm-bindgen symbols, which would clash when
# linked into the wasm test binary, so keep it to native (non-wasm) test builds.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
mission-platform-pdf417-encode.workspace = true

# Skip wasm-pack's bundled `wasm-opt` post-pass; size optimisation already comes
# from the workspace release profile.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
