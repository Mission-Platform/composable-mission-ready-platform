[package]
name = "mission-platform-maxicode-encode"
version = "0.1.0"
edition = "2021"
description = "Dependency-free MaxiCode encoder compiled to WebAssembly for @mission-platform/code-scanner"
license = "MIT"
publish = false

[lib]
# `cdylib` for the shipped wasm; `rlib` so the crate can also be unit-tested
# natively with `cargo test`.
crate-type = ["cdylib", "rlib"]

[features]
# The crate's own wasm build ships the `wasm-bindgen` `encode` export, so
# `wasm-api` is on by default. Consumers that link this crate into another cdylib
# depend with `default-features = false` so the duplicate `encode`/`start`
# exports are dropped and only the dependency-free `encode_maxicode` entry point
# is compiled.
default = ["wasm-api"]
# Emit the `wasm-bindgen` `encode` (and `start`) exports. Off when the crate is
# used purely as a native/rlib encode library.
wasm-api = []
# Optional in-browser diagnostics: compile in a `tracing-wasm` subscriber and a
# panic hook. Implies `wasm-api`.
console = [
    "wasm-api",
    "dep:tracing-wasm",
    "dep:mission-platform-console-panic-hook",
]

[dependencies]
mission-platform-maxicode-common.workspace = true
wasm-bindgen.workspace = true
tracing = { workspace = true }
tracing-wasm = { workspace = true, optional = true }
mission-platform-console-panic-hook = { workspace = true, optional = true }

[dev-dependencies]
# In-crate wasm-bindgen tests run under `wasm-pack test`.
wasm-bindgen-test.workspace = true

# Skip wasm-pack's bundled `wasm-opt` post-pass; size optimisation already comes
# from the workspace release profile.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
