[package]
name = "mission-platform-console-panic-hook"
version = "0.1.0"
edition = "2021"
description = "Tiny panic hook that forwards Rust panics to the browser devtools console (in-house replacement for the archived console_error_panic_hook)"
license = "BSD-4-Clause"
publish = false

[dependencies]
wasm-bindgen.workspace = true
# The panic hook reports panics through `tracing::error!`, so whatever
# `tracing` subscriber the host installs (e.g. `tracing-wasm`) receives them.
tracing.workspace = true
# Runtime use is only the `shadow!` macro, so default (git2/C) features stay off
# to keep the wasm build free of the git2 C backend.
shadow-rs.workspace = true

[build-dependencies]
# Re-enable the build-script API (`build`) and the `git2` backend at build time
# (host-compiled) to capture commit info. Together these match shadow-rs's
# default feature set, which the workspace dependency turns off for the wasm
# runtime side.
shadow-rs = { workspace = true, features = ["build", "git2"] }
