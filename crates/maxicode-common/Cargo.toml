[package]
name = "mission-platform-maxicode-common"
version = "0.1.0"
edition = "2021"
description = "Shared MaxiCode primitives (30x33 bit map, GF(64) Reed-Solomon) for the encode/decode crates"
license = "BSD-4-Clause"
publish = false

[lib]
# A plain library: it is linked into the `-encode` / `-decode` wasm crates and
# unit-tested natively with `cargo test`.
crate-type = ["rlib"]

[dependencies]
# `tracing` instrumentation is compiled in unconditionally; with no subscriber
# installed (the default, diagnostics-off build) the macros compile to nothing.
tracing = { workspace = true }
