name: Conventional Commits

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - edited
      - reopened
      - synchronize

concurrency:
  group: conventional-commits-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-commits:
    name: Validate commit messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Fetch the full PR history so we can lint every commit in the range.
          fetch-depth: 0

      - name: Validate Conventional Commits
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Conventional Commits v1.0.0 — type(scope)!: description
          # Allowed types match the convention documented in AGENTS.md.
          pattern='^(feat|fix|refactor|style|chore|docs|test|build|ci|perf|revert)(\([a-z0-9_.\/-]+\))?!?: [^A-Z].{0,71}$'

          git fetch --no-tags --depth=0 origin "$BASE_SHA" "$HEAD_SHA" >/dev/null 2>&1 || true

          mapfile -t commits < <(git log --no-merges --format='%H' "$BASE_SHA".."$HEAD_SHA")

          if [ "${#commits[@]}" -eq 0 ]; then
            echo "No non-merge commits to validate."
            exit 0
          fi

          failed=0
          for sha in "${commits[@]}"; do
            subject=$(git log -1 --format='%s' "$sha")
            if [[ ! "$subject" =~ $pattern ]]; then
              echo "::error::Commit $sha does not follow Conventional Commits: $subject"
              failed=1
            else
              echo "ok: $sha $subject"
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "Expected format: <type>(<scope>)!: <description>"
            echo "Allowed types:   feat, fix, refactor, style, chore, docs, test, build, ci, perf, revert"
            echo "Description:     lowercase imperative mood, no trailing period, ≤ 72 chars total subject."
            exit 1
          fi

  changeset:
    name: Require a changeset for package changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify changeset status
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: pnpm changeset status --since="origin/${BASE_REF}"
