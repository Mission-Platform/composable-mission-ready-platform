name: Publish Packages

on:
  push:
    branches:
      - main      # production release
      - develop   # staging / pre-release

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest

    # Map the branch onto a GitHub environment so deployments are tracked,
    # protection rules / secrets can differ per environment, and the
    # environment URL is surfaced in the GitHub UI.
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      url: https://github.com/${{ github.repository }}/pkgs/container

    permissions:
      contents: write          # needed for Changesets to create/update the release PR
      packages: write          # needed to publish to GitHub Packages
      pull-requests: write     # needed for Changesets to open the version PR
      id-token: write          # mint the OIDC token used to request a Sigstore signing certificate
    #      attestations: write      # persist the generated build provenance attestation
    #      artifact-metadata: write # create the artifact storage record for the attestation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history is required so Changesets can diff versions
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: "@mission-platform"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache Vite's on-disk dependency pre-bundling and Turborepo's local task
      # cache across runs, so releases reuse build artefacts the same way CI
      # does.  Keyed on the lockfile + workflow file so it invalidates whenever
      # dependencies or this workflow change.
      - name: Cache Vite & Turbo artefacts
        uses: actions/cache@v5
        with:
          path: |
            **/node_modules/.vite
            **/.vite
            **/.turbo
            .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', '.github/workflows/publish.yml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build packages
        run: pnpm exec turbo run build --filter="./packages/**"

      # ──────────────────────────────────────────────────────────────
      # PRODUCTION — main branch
      # Changesets creates a "Version Packages" PR; when that PR is
      # merged, the same workflow runs again and publishes the release.
      # ──────────────────────────────────────────────────────────────
      - name: Publish (production — main)
        id: changesets
        if: github.ref == 'refs/heads/main'
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          title: "chore: release packages"
          commit: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ──────────────────────────────────────────────────────────────
      # STAGING — develop branch
      # Publishes a pre-release snapshot with a `dev` dist-tag so it
      # is never resolved as the `latest` version by default.
      # ──────────────────────────────────────────────────────────────
      - name: Enter pre-release mode (staging — develop)
        if: github.ref == 'refs/heads/develop'
        run: pnpm changeset pre enter dev

      - name: Version pre-release packages (staging — develop)
        if: github.ref == 'refs/heads/develop'
        run: pnpm changeset version

      - name: Publish pre-release (staging — develop)
        if: github.ref == 'refs/heads/develop'
        run: pnpm changeset publish --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ──────────────────────────────────────────────────────────────
      # ATTESTATION — build provenance for the published packages
      # Re-pack each publishable package into the exact tarball that was
      # published (pnpm pack mirrors pnpm publish), then generate a SLSA
      # build provenance attestation for those tarballs with
      # `actions/attest`.  This lets consumers cryptographically verify
      # that a package tarball was produced by this workflow, from this
      # repository, at a specific commit.  Runs only when packages were
      # actually published (every develop run, and main runs where the
      # Changesets release PR was merged).
      # ──────────────────────────────────────────────────────────────
      #      - name: Pack published packages for attestation
      #        if: github.ref == 'refs/heads/develop' || (github.ref == 'refs/heads/main' && steps.changesets.outputs.published == 'true')
      #        run: |
      #          mkdir -p "${{ runner.temp }}/attestations"
      #          pnpm --filter="./packages/**" exec \
      #            pnpm pack --pack-destination "${{ runner.temp }}/attestations"
      #
      #      - name: Attest package build provenance
      #        if: github.ref == 'refs/heads/develop' || (github.ref == 'refs/heads/main' && steps.changesets.outputs.published == 'true')
      #        uses: actions/attest@v4
      #        with:
      #          subject-path: "${{ runner.temp }}/attestations/*.tgz"

      # ──────────────────────────────────────────────────────────────
      # PRODUCTION DEPLOY — main branch
      # Deploy the apps to the Cloudflare production environment, but ONLY
      # when merging the Changesets release PR actually published a new
      # version (`steps.changesets.outputs.published == 'true'`).  Ordinary
      # pushes to `main` that don't publish a release (e.g. the release PR
      # simply being (re)generated) must not trigger a production deploy.
      # `turbo` builds the apps + forge-spa worker on demand via the per-app
      # `deploy` task (`wrangler deploy --env production`).
      # ──────────────────────────────────────────────────────────────
      - name: Deploy to production
        if: github.ref == 'refs/heads/main' && steps.changesets.outputs.published == 'true'
        run: >-
          pnpm exec turbo run deploy
          --filter=@mission-platform/website
          --filter=@mission-platform/my-care-notes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
