name: Build Hunspell Docker Image

on:
  push:
    branches:
      - main
      - develop
    paths:
      - packages/hunspell/docker/**
  pull_request:
    branches:
      - main
      - develop
    paths:
      - packages/hunspell/docker/**

concurrency:
  group: docker-hunspell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Hunspell WASM Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Hunspell WASM
        run: GHA_CACHE=1 bash packages/hunspell/build.sh
