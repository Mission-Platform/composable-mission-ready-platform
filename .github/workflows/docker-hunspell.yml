name: Build Hunspell Docker Image

on:
  push:
    branches:
      - main
      - develop
    paths:
      - packages/content/hunspell/docker/**
  pull_request:
    branches:
      - main
      - develop
    paths:
      - packages/content/hunspell/docker/**

concurrency:
  group: docker-hunspell-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Hunspell WASM Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Hunspell WASM
        run: GHA_CACHE=1 bash packages/content/hunspell/build.sh
