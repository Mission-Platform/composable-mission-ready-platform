name: Deploy

# STAGING deployments are driven by the Changesets release flow:
#
#   • Changesets opens/updates a release pull request from the
#     `changeset-release/main` branch.  Every push to that branch (i.e. each
#     time the release PR is (re)generated) deploys the apps to STAGING so the
#     pending release can be previewed.
#
# The PRODUCTION deployment is NOT handled here — it lives in `publish.yml`,
# gated on `steps.changesets.outputs.published`, so production deploys only
# when merging the release PR actually publishes a new version.
on:
  push:
    branches:
      - changeset-release/main # staging deployment (release PR (re)generated)

# Never cancel an in-progress deploy; let each environment's deploys serialise.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (staging)
    # Deploy the release branch to Cloudflare's staging environment. The
    # credential check below keeps this job green when staging secrets are not
    # configured for a fork or another repository environment.
    runs-on: ubuntu-latest

    # Map onto the GitHub `staging` environment so deployments are tracked and
    # environment-scoped secrets / protection rules apply.
    environment:
      name: staging

    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Full history lets `turbo` determine the affected changes.
          fetch-depth: 0

      - name: Check staging credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging deployment skipped because Cloudflare credentials are not configured."
          fi

      - name: Set up pnpm
        if: steps.credentials.outputs.configured == 'true'
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          run_install: false

      - name: Set up Node.js
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        if: steps.credentials.outputs.configured == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install dependencies
        if: steps.credentials.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      # ──────────────────────────────────────────────────────────────
      # STAGING — changeset-release/main branch
      # Each push to the Changesets release branch deploys the staging
      # environment (`wrangler deploy --env staging`) via the per-app
      # `deploy:staging` turbo task.
      # ──────────────────────────────────────────────────────────────
      - name: Deploy to staging
        if: steps.credentials.outputs.configured == 'true'
        run: >-
          pnpm exec turbo run deploy:staging
          --filter=@mission-platform/website
          --filter=@mission-platform/my-care-notes
