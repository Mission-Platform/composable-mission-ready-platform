name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # Production deployment — push to main
  # Deploys to notes.mission-platform.com via the `production`
  # environment defined in wrangler.jsonc, tracked under the
  # GitHub `production` environment.
  # ──────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy My Care Notes (production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://notes.mission-platform.com

    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:dependencies

      - name: Build app
        run: pnpm --filter @mission-platform/my-care-notes build

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mission-platform-my-care-notes --branch=main
          workingDirectory: apps/my-care-notes
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────
  # Staging (preview) deployment — pull requests targeting main
  # Deploys to notes.mission-platform.dev via the `preview`
  # environment defined in wrangler.jsonc, tracked under the
  # GitHub `staging` environment.
  # ──────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy My Care Notes (staging)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    environment:
      name: staging
      url: https://notes.mission-platform.dev

    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:dependencies

      - name: Build app
        run: pnpm --filter @mission-platform/my-care-notes build

      - name: Deploy to Cloudflare Pages (preview)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mission-platform-my-care-notes --branch=preview
          workingDirectory: apps/my-care-notes
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
