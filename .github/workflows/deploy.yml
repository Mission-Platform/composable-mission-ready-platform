name: Deploy

# STAGING deployments are driven by the Changesets release flow:
#
#   • Changesets opens/updates a release pull request from the
#     `changeset-release/main` branch.  Every push to that branch (i.e. each
#     time the release PR is (re)generated) deploys the apps to STAGING so the
#     pending release can be previewed.
#
# The PRODUCTION deployment is NOT handled here — it lives in `publish.yml`,
# gated on `steps.changesets.outputs.published`, so production deploys only
# when merging the release PR actually publishes a new version.
on:
  push:
    branches:
      - changeset-release/main  # staging deployment (release PR (re)generated)

# Never cancel an in-progress deploy; let each environment's deploys serialise.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (staging)
    runs-on: ubuntu-latest

    # Map onto the GitHub `staging` environment so deployments are tracked and
    # environment-scoped secrets / protection rules apply.
    environment:
      name: staging

    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history lets `turbo` diff against previous runs for caching.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache Vite's on-disk dependency pre-bundling and Turborepo's local task
      # cache across runs.  Keyed on the lockfile + workflow file so it
      # invalidates whenever dependencies or this workflow change.
      - name: Cache Vite & Turbo artefacts
        uses: actions/cache@v5
        with:
          path: |
            **/node_modules/.vite
            **/.vite
            **/.turbo
            .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', '.github/workflows/deploy.yml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # ──────────────────────────────────────────────────────────────
      # STAGING — changeset-release/main branch
      # Each push to the Changesets release branch deploys the staging
      # environment (`wrangler deploy --env staging`) via the per-app
      # `deploy:staging` turbo task.
      # ──────────────────────────────────────────────────────────────
      - name: Deploy to staging
        run: >-
          pnpm exec turbo run deploy:staging
          --filter=@mission-platform/website
          --filter=@mission-platform/my-care-notes
