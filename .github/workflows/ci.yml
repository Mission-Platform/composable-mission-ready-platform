name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install playwright browsers
        run: pnpm dlx playwright install --with-deps

      # Cache Vite's on-disk dependency pre-bundling + Turbo-style build caches
      # across runs.  Keyed on the lockfile + workflow file so it invalidates
      # whenever dependencies or CI configuration change.
      - name: Cache Vite & build artefacts
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules/.vite
            **/.vite
            **/dist
          key: ${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Lint
        run: pnpm lint

      - name: Build packages
        run: pnpm build

      - name: Run package tests
        run: pnpm --filter "./packages/**" test

      - name: Run app tests
        run: pnpm --filter "./apps/**" test
