name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history lets `turbo run … --affected` diff against the base.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint all affected workspaces
        run: pnpm exec turbo run lint --affected --cache=local:,remote:

      # test:coverage depends on each workspace's build and runs every affected
      # package, app, worker, plugin, and config that exposes the task.
      - name: Run affected coverage tests
        run: pnpm exec turbo run test:coverage --affected --cache=local:,remote:
