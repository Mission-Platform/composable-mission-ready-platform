name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history lets `turbo run … --affected` diff against the base.
          fetch-depth: 0

      - name: Set Turbo SCM comparison range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          readonly zero_sha=0000000000000000000000000000000000000000

          resolve_commit() {
            local commit="$1"
            local label="$2"
            local ref="$3"

            if git cat-file -e "${commit}^{commit}" 2>/dev/null; then
              return
            fi

            if [[ -n "$ref" ]]; then
              git fetch --no-tags origin "$ref" || true
            fi
            if ! git cat-file -e "${commit}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$commit" || true
            fi
            if ! git cat-file -e "${commit}^{commit}" 2>/dev/null; then
              echo "::error::Unable to resolve the $label commit '$commit' after the full-history checkout." >&2
              exit 1
            fi
          }

          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              head="$GITHUB_SHA"
              base_ref="refs/heads/$PR_BASE_REF"
              head_ref="$GITHUB_REF"
              ;;
            push)
              base="$PUSH_BEFORE_SHA"
              head="$GITHUB_SHA"
              base_ref="$GITHUB_REF"
              head_ref="$GITHUB_REF"
              ;;
            *)
              echo "::error::Unsupported CI event '$EVENT_NAME'; cannot determine a Turbo SCM comparison range." >&2
              exit 1
              ;;
          esac

          if [[ -z "$base" || -z "$head" ]]; then
            echo "::error::The $EVENT_NAME event did not provide both Turbo SCM comparison commits." >&2
            exit 1
          fi
          if [[ "$base" == "$zero_sha" ]]; then
            if git rev-parse --verify "${head}^" >/dev/null 2>&1; then
              base=$(git rev-parse "${head}^")
            elif git rev-parse --verify origin/main >/dev/null 2>&1; then
              base=$(git rev-parse origin/main)
            elif git rev-parse --verify origin/develop >/dev/null 2>&1; then
              base=$(git rev-parse origin/develop)
            else
              echo "::error::The initial push has no previous commit for Turbo's affected comparison." >&2
              exit 1
            fi
          fi

          resolve_commit "$base" "base" "$base_ref"
          resolve_commit "$head" "head" "$head_ref"

          printf 'TURBO_SCM_BASE=%s\n' "$base" >> "$GITHUB_ENV"
          printf 'TURBO_SCM_HEAD=%s\n' "$head" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies for critical vulnerabilities
        run: pnpm audit --audit-level=critical

      - name: Run MCP security and compliance checks
        run: pnpm --filter @mission-platform/mcp-developer exec node --test src/security.test.ts

      - name: Build all affected workspaces
        run: pnpm exec turbo run build --affected

      - name: Lint all affected workspaces
        run: pnpm exec turbo run lint --affected

      - name: Style-check all affected workspaces
        run: pnpm exec turbo run lint:style --affected

      # The plain test task is available in every affected workspace, including
      # workspaces that intentionally do not collect coverage.
      - name: Run affected tests
        run: pnpm exec turbo run test --affected

      - name: Run Flint static analysis SARIF generation
        run: |
          mkdir -p artifacts
          pnpm exec turbo run build --filter @mission-platform/flint-cli...
          node packages/flint/cli/dist/main.js check packages/flint/core/src/fixtures/file-compile.flint --format sarif > artifacts/flint-sarif.json

      - name: Upload Flint SARIF artifact
        uses: actions/upload-artifact@v7
        with:
          name: flint-sarif
          path: artifacts/flint-sarif.json
          if-no-files-found: error
