trustPolicy: no-downgrade

registries:
  default: https://registry.npmjs.org/

namedRegistries:
  gh: https://npm.pkg.github.com/

trustPolicyExclude:
  - tinyexec
  - ast-v8-to-istanbul
  - semver@6.3.1
  - "@trickfilm400/rollup-plugin-off-main-thread"
  - rwsdk

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
  workerd: true

overrides:
  glob: ^13.0.6
  source-map: ^0.7.6
  beasties: ^0.4.2
  DOMPurify: ^3.4.9
  nanoid: ^5.1.16

patchedDependencies:
  "eslint-plugin-sonarjs@4.2.0": patches/eslint-plugin-sonarjs.patch
