    nav:
      features: 功能
      packages: 软件包
      about: 关于
      faq: 常见问题
    hero:
      badge: 可组合 · 任务就绪
      title: 面向现代 Vue 3 产品的可组合、任务就绪的平台。
      lead: >-
        Mission Platform 是一个可复用 Vue 3 构建块 —— 组件、设计令牌、可组合函数、Cloudflare Workers 和 SEO 原语 ——
        的单体仓库,让团队无需重新造轮子,即可拼装精致、高性能且易于被发现的应用。
      cta-primary: 浏览平台
      cta-secondary: 阅读文档
    features:
      title: 为什么选择 Mission Platform?
      items:
        - title: 从设计上就可组合
          description: 每项能力都作为独立、可版本化的软件包发布。按需挑选,组合出你自己的产品。
        - title: 任务就绪的性能
          description: 基于 Vue 3、Vite 和现代 Web 标准构建。离线优先,对 PWA 友好,可直接部署到边缘。
        - title: 一致的设计系统
          description: 共享的设计令牌、主题和精致的 Vue 3 组件库 —— 开箱即用,可访问且可主题化。
        - title: i18n 与 a11y 优先
          description: vue-i18n 集成、RTL 友好的布局以及经过无障碍测试的组件,让你的产品讲每个用户的语言。
        - title: 开发者体验
          description: Storybook 工作台、共享的 ESLint/Prettier/Stylelint 配置、Vitest + Playwright —— 全部接好即用。
        - title: 边缘原生部署
          description: 一流的 Cloudflare Workers 支持,并提供 base-spa worker 用于静态资源 + SPA 回退托管。
        - title: 默认易于被发现
          description: 内置的 Open Graph 与 page-meta 可组合函数,加上预渲染的 SSG 输出,让每条路由都具备良好的 SEO 与分享能力。
    packages:
      title: 构建块
      lead: 每个软件包都独立版本化和发布。混合、搭配、组合。
      items:
        - Vue 3 组件库
        - CSS 设计令牌与 SCSS 主题
        - SVG 图标组件
        - 响应式工具与可组合函数
        - vue-i18n 集成与基础语言包
        - 面向 Vue 3 的 MapLibre GL 封装
        - 面向 Monaco 的 Harper 语法检查器
        - Hunspell 拼写检查器(WASM)
        - 统一 SEO:页面元数据、Open Graph、Twitter Card 与 JSON-LD
        - base-spa Cloudflare Worker
    about:
      title: 我们正在构建什么
      lead: Mission Platform 在多种领域驱动着真实的应用。平台的目标,是让精致且任务就绪的体验可复制、可组合,并易于交付。
    projects:
      aria-label: 使用 Mission Platform 构建的项目
      items:
        my-care-notes:
          name: My Care Notes
          description: 一个具备 WebAssembly 拼写检查 (Hunspell) 与语法辅助 (Harper) 的离线优先临床笔记编辑器,基于 Mission Platform 的软件包构建。
          cta: 打开在线应用
    faq:
      title: 常见问题
      items:
        affiliation:
          question: Mission Platform 是否与其他项目有关联?
          answer: 没有。Mission Platform 是一个独立的开源项目和组织,与任何可能拥有相同或相似名称的其他项目、产品、公司或组织均无关联、背书或关系。
        composable:
          question: 这里的"可组合"到底是什么意思?
          answer: 每一项能力 —— 组件、令牌、i18n、地图、拼写检查 —— 都存在于各自独立的版本化软件包中。你只引入需要的部分,自行组装产品,而不是采用一个庞大的整体框架。
        vue-version:
          question: 支持哪个 Vue 版本?
          answer: Vue 3.5+,使用 Composition API 与 `script setup` 语法。所有软件包均使用 TypeScript 编写,并附带完整的类型定义。
        deploy:
          question: 如何部署 Mission Platform 应用?
          answer: 应用是用 Vite 构建的单页应用。我们提供一流的 base-spa Cloudflare Worker,用于边缘原生的静态资源 + SPA 回退托管,但任何能托管静态文件的服务都可以。
    footer:
      disclaimer: '{brand} 是一个独立的开源项目和组织。它与任何可能拥有相同或相似名称的其他项目、产品、公司或组织{not-affiliated}。与现有名称的任何相似之处纯属巧合。'
      not-affiliated: 均无关联、未受其背书,也不存在关联关系
      copyright: © {year} Mission Platform 贡献者。
