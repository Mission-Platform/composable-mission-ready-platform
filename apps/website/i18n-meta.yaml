        - 반응형 유틸리티 및 컴포저블
        - vue-i18n 통합 및 기본 로케일
        - Vue 3용 MapLibre GL 래퍼
        - Monaco용 Harper 문법 검사기
        - Hunspell 맞춤법 검사기 (WASM)
        - '통합 SEO: 페이지 메타데이터, Open Graph, Twitter Card 및 JSON-LD'
        - base-spa Cloudflare 워커
    about:
      title: 우리가 만드는 것
      lead: Mission Platform은 다양한 도메인에서 실제 애플리케이션을 구동합니다. 플랫폼의 목표는 정제되고 미션 대응이 된 경험을 반복 가능하고, 컴포저블하며, 쉽게 출시할 수 있도록 만드는 것입니다.
    projects:
      aria-label: Mission Platform으로 만든 프로젝트
      items:
        my-care-notes:
          name: My Care Notes
          description: WebAssembly 맞춤법 검사(Hunspell)와 문법 도우미(Harper)를 갖춘 오프라인 우선 임상 노트 편집기로, Mission Platform 패키지 위에 구축되었습니다.
          cta: 라이브 앱 열기
    faq:
      title: 자주 묻는 질문
      items:
        affiliation:
          question: Mission Platform은 다른 프로젝트와 제휴되어 있나요?
          answer: >-
            아닙니다. Mission Platform은 독립적인 오픈 소스 프로젝트이자 조직이며, 동일하거나 유사한 이름을 사용할 수 있는 어떠한 다른 프로젝트, 제품, 회사 또는 조직과도 제휴, 보증 또는
            연관이 없습니다.
        composable:
          question: 여기서 "컴포저블"이란 실제로 무엇을 의미하나요?
          answer: >-
            모든 기능 — 컴포넌트, 토큰, i18n, 지도, 맞춤법 검사 — 은 각자 버전이 관리되는 패키지에 들어 있습니다. 모놀리식 프레임워크를 채택하는 대신 필요한 것만 가져와 직접 제품을
            조립합니다.
        vue-version:
          question: 어떤 Vue 버전이 지원되나요?
          answer: Composition API와 `script setup` 구문을 사용하는 Vue 3.5+. 모든 패키지는 TypeScript로 작성되었으며 완전한 타입 정의를 제공합니다.
        deploy:
