        이름과의 유사성은 우연의 일치입니다.
      not-affiliated: 제휴, 보증 또는 연관되어 있지 않습니다
      copyright: © {year} Mission Platform 기여자들.
nl:
  HomeView:
    ai-translation-warning: Deze pagina is vertaald door AI. Sommige formuleringen kunnen onnauwkeurig zijn — de Engelse versie is leidend.
    nav:
      features: Functies
      packages: Pakketten
      about: Over
      faq: FAQ
    hero:
      badge: Samen te stellen · Missie-klaar
      title: Een samen te stellen, missie-klaar platform voor moderne Vue 3-producten.
      lead: >-
        Mission Platform is een monorepo van herbruikbare Vue 3-bouwstenen — componenten, design-tokens, composables en
        Cloudflare Workers — waarmee teams gepolijste, performante applicaties kunnen samenstellen zonder het wiel
        opnieuw uit te vinden.
      cta-primary: Verken het platform
      cta-secondary: Lees de documentatie
    features:
      title: Waarom Mission Platform?
      items:
        - title: Samen te stellen van nature
          description: >-
            Elke mogelijkheid wordt geleverd als een onafhankelijk, geversioneerd pakket. Kies wat je nodig hebt en stel
            je eigen product samen.
        - title: Missie-klare prestaties
          description: Gebouwd op Vue 3, Vite en moderne webstandaarden. Offline-first, PWA-vriendelijk en klaar voor de edge.
        - title: Samenhangend designsysteem
          description: >-
            Gedeelde design-tokens, thema’s en een verzorgde Vue 3-componentenbibliotheek — toegankelijk en
            thematiseerbaar uit de doos.
        - title: i18n en a11y voorop
          description: >-
            vue-i18n-integratie, RTL-bewuste layouts en op toegankelijkheid geteste componenten zorgen dat je product de
            taal van elke gebruiker spreekt.
        - title: Ontwikkelaarservaring
          description: >-
            Storybook-werkbank, gedeelde ESLint/Prettier/Stylelint-configuraties, Vitest + Playwright — alles
            aangesloten en klaar.
        - title: Edge-native uitrol
          description: >-
            Eersteklas ondersteuning voor Cloudflare Workers met de base-spa-worker voor statische hosting met
            SPA-fallback.
        - title: Standaard vindbaar
          description: >-
            Ingebouwde Open Graph- en page-meta-composables plus prerenderde SSG-output houden elke route SEO-klaar en
            deelbaar.
    packages:
      title: Bouwstenen
      lead: Elk pakket wordt onafhankelijk geversioneerd en gepubliceerd. Mix, match en stel samen.
      items:
        - Vue 3-componentenbibliotheek
        - CSS design-tokens en SCSS-thema’s
        - SVG-icooncomponenten
        - Responsieve utilities en composables
        - vue-i18n-integratie en basis-locales
        - MapLibre GL Vue 3-wrapper
        - Harper grammaticacontrole voor Monaco
        - Hunspell spellingcontrole (WASM)
        - 'Geünificeerde SEO: paginametadata, Open Graph, Twitter Card en JSON-LD'
        - base-spa Cloudflare Worker
    about:
      title: Wat we bouwen
      lead: >-
        Mission Platform draait echte applicaties in uiteenlopende domeinen. Het doel van het platform is om gepolijste,
        mission-ready ervaringen herhaalbaar, samen te stellen en eenvoudig leverbaar te maken.
    projects:
      aria-label: Projecten gebouwd met Mission Platform
      items:
        my-care-notes:
          name: My Care Notes
          description: >-
            Een offline-first klinische notitie-editor met WebAssembly-spellingcontrole (Hunspell) en
            grammatica-ondersteuning (Harper), gebouwd op de pakketten van Mission Platform.
          cta: Open de live-app
    faq:
      title: Veelgestelde vragen
      items:
        affiliation:
          question: Is Mission Platform verbonden met een ander project?
          answer: >-
            Nee. Mission Platform is een onafhankelijk open-source project en organisatie, en is niet verbonden met,
            onderschreven door of geassocieerd met enig ander project, product, bedrijf of organisatie dat dezelfde of
            een vergelijkbare naam zou kunnen dragen.
        composable:
          question: Wat betekent «samen te stellen» hier eigenlijk?
          answer: >-
            Elke mogelijkheid — componenten, tokens, i18n, kaarten, spellingcontrole — leeft in een eigen geversioneerd
            pakket. Je trekt alleen binnen wat je nodig hebt en stelt je eigen product samen, in plaats van een
            monolithisch framework te adopteren.
        vue-version:
          question: Welke Vue-versie wordt ondersteund?
          answer: >-
            Vue 3.5+ met de Composition API en de `script setup`-syntaxis. Alle pakketten zijn geschreven in TypeScript
            en worden geleverd met volledige typedefinities.
        deploy:
          question: Hoe ontplooi ik een Mission Platform-app?
          answer: >-
            Apps zijn met Vite gebouwde single-page apps. Een eersteklas base-spa Cloudflare Worker is meegeleverd voor
            edge-native statische hosting met SPA-fallback, maar elke statische bestandsserver werkt.
    footer:
      disclaimer: >-
        {brand} is een onafhankelijk open-source project en organisatie. Het is {not-affiliated} enig ander project,
        product, bedrijf of organisatie dat dezelfde of een vergelijkbare naam zou kunnen dragen. Elke gelijkenis met
        bestaande namen berust op toeval.
      not-affiliated: niet verbonden met, onderschreven door of geassocieerd met
      copyright: © {year} Mission Platform-bijdragers.
zh:
