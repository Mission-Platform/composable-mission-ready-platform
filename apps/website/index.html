<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
      name="viewport"
    />
    <meta
      content="#4a9ebe"
      name="theme-color"
    />

    <!-- Primary SEO, Open Graph, and Twitter metadata are injected at runtime
         by @mission-platform/page-meta and @mission-platform/open-graph
         (see src/main.ts). A minimal <title> is kept here so the document has
         a sensible title before the JS bundle executes. -->
    <title>Mission Platform — Composable. Mission Ready.</title>

    <!-- Icons -->
    <link
      href="/favicon.svg"
      rel="icon"
      type="image/svg+xml"
    />
    <link
      href="/favicon.svg"
      rel="apple-touch-icon"
    />

    <!-- Open Graph + Twitter metadata is injected at runtime by
         @mission-platform/open-graph (see src/main.ts). -->

    <!-- Structured data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Mission Platform",
        "url": "https://mission-platform.dev/",
        "description": "An independent, composable Vue 3 monorepo of design tokens, components, composables, and Cloudflare Workers for building modern, mission-ready web experiences.",
        "publisher": {
          "@type": "Organization",
          "name": "Mission Platform",
          "url": "https://mission-platform.dev/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://mission-platform.dev/favicon.svg"
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script
      src="/src/main.ts"
      type="module"
    ></script>
  </body>
</html>
