<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
      name="viewport"
    />
    <meta
      content="#4a9ebe"
      name="theme-color"
    />

    <!-- Primary SEO surface — standard page metadata, Open Graph / Twitter
         Card metadata, and JSON-LD structured data — is injected at runtime
         (and baked into prerendered HTML per locale) by
         @mission-platform/seo via the `useSeo` composable in src/main.ts.
         A minimal <title> is kept here so the document has a sensible title
         before the JS bundle executes. -->
    <title>Mission Platform — Composable. Mission Ready.</title>

    <!-- Icons -->
    <link
      href="/favicon.svg"
      rel="icon"
      type="image/svg+xml"
    />
    <link
      href="/favicon.svg"
      rel="apple-touch-icon"
    />

    <!-- Open Graph + Twitter Card meta tags and JSON-LD structured data
         (WebSite, Organization, …) are injected at runtime by
         @mission-platform/seo — see src/main.ts. They are also baked into the
         prerendered HTML for every locale by vite-ssg. -->
  </head>
  <body>
    <div id="app"></div>
    <script
      src="/src/main.ts"
      type="module"
    ></script>
  </body>
</html>
