<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
      name="viewport"
    />
    <meta
      content="#4a9ebe"
      name="theme-color"
    />

    <!-- Primary SEO -->
    <title>Mission Platform — Composable. Mission Ready.</title>
    <meta
      content="Mission Platform is an independent, composable Vue 3 monorepo of design tokens, components, composables, and Cloudflare Workers for building modern, mission-ready web experiences."
      name="description"
    />
    <meta
      content="Mission Platform"
      name="author"
    />
    <meta
      content="Vue 3, monorepo, design system, components, composable, Cloudflare Workers, TypeScript, Vite, Storybook, mission ready, Mission Platform"
      name="keywords"
    />
    <link
      href="https://mission-platform.dev/"
      rel="canonical"
    />
    <meta
      content="index,follow"
      name="robots"
    />

    <!-- Icons -->
    <link
      href="/favicon.svg"
      rel="icon"
      type="image/svg+xml"
    />
    <link
      href="/favicon.svg"
      rel="apple-touch-icon"
    />

    <!-- Open Graph -->
    <meta
      content="website"
      property="og:type"
    />
    <meta
      content="Mission Platform"
      property="og:site_name"
    />
    <meta
      content="Mission Platform — Composable. Mission Ready."
      property="og:title"
    />
    <meta
      content="An independent, composable Vue 3 monorepo of design tokens, components, composables, and Cloudflare Workers for building modern, mission-ready web experiences."
      property="og:description"
    />
    <meta
      content="https://mission-platform.dev/"
      property="og:url"
    />
    <meta
      content="https://mission-platform.dev/og-image.svg"
      property="og:image"
    />
    <meta
      content="image/svg+xml"
      property="og:image:type"
    />
    <meta
      content="1200"
      property="og:image:width"
    />
    <meta
      content="630"
      property="og:image:height"
    />
    <meta
      content="Mission Platform — Composable. Mission Ready."
      property="og:image:alt"
    />
    <meta
      content="en_GB"
      property="og:locale"
    />

    <!-- Twitter / X -->
    <meta
      content="summary_large_image"
      name="twitter:card"
    />
    <meta
      content="Mission Platform — Composable. Mission Ready."
      name="twitter:title"
    />
    <meta
      content="An independent, composable Vue 3 monorepo for building modern, mission-ready web experiences."
      name="twitter:description"
    />
    <meta
      content="https://mission-platform.dev/og-image.svg"
      name="twitter:image"
    />
    <meta
      content="Mission Platform — Composable. Mission Ready."
      name="twitter:image:alt"
    />

    <!-- Structured data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Mission Platform",
        "url": "https://mission-platform.dev/",
        "description": "An independent, composable Vue 3 monorepo of design tokens, components, composables, and Cloudflare Workers for building modern, mission-ready web experiences.",
        "publisher": {
          "@type": "Organization",
          "name": "Mission Platform",
          "url": "https://mission-platform.dev/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://mission-platform.dev/favicon.svg"
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script
      src="/src/main.ts"
      type="module"
    ></script>
  </body>
</html>
