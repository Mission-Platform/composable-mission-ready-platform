faq:
  title: Domande frequenti
  items:
    affiliation:
      question: Mission Platform è affiliata ad altri progetti?
      answer: >-
        No. Mission Platform è un progetto e un’organizzazione open-source indipendenti e non è affiliata, sostenuta o
        associata ad alcun altro progetto, prodotto, azienda o organizzazione che possa condividere lo stesso nome o uno
        simile.
    composable:
      question: Cosa significa davvero «componibile» qui?
      answer: >-
        Ogni capacità — componenti, token, i18n, mappe, controllo ortografico — vive nel proprio pacchetto versionato.
        Importi solo ciò che ti serve e assembli il tuo prodotto, invece di adottare un framework monolitico.
    vue-version:
      question: Quale versione di Vue è supportata?
      answer: >-
        Vue 3.5+ con la Composition API e la sintassi `script setup`. Tutti i pacchetti sono scritti in TypeScript e
        includono definizioni di tipi complete.
    deploy:
      question: Come distribuisco un’app Mission Platform?
      answer: >-
        Le app sono SPA costruite con Vite. È incluso un Cloudflare Worker base-spa di prima classe per hosting statico
        + fallback SPA edge-native, ma qualsiasi server di file statici funziona.
