faq:
  title: Häufig gestellte Fragen
  items:
    affiliation:
      question: Ist Mission Platform mit anderen Projekten verbunden?
      answer: >-
        Nein. Mission Platform ist ein unabhängiges Open-Source-Projekt und eine unabhängige Organisation und ist mit
        keinem anderen Projekt, Produkt, Unternehmen oder keiner Organisation verbunden, befürwortet oder assoziiert,
        das oder die denselben oder einen ähnlichen Namen tragen könnte.
    composable:
      question: Was bedeutet „komponierbar“ hier eigentlich?
      answer: >-
        Jede Fähigkeit — Komponenten, Tokens, i18n, Karten, Rechtschreibprüfung — lebt in einem eigenen versionierten
        Paket. Du importierst nur, was du brauchst, und stellst dein eigenes Produkt zusammen, statt ein monolithisches
        Framework zu übernehmen.
    vue-version:
      question: Welche Vue-Version wird unterstützt?
      answer: >-
        Vue 3.5+ mit der Composition API und der `script setup`-Syntax. Alle Pakete sind in TypeScript geschrieben und
        liefern vollständige Typdefinitionen.
    deploy:
      question: Wie deploye ich eine Mission Platform-App?
      answer: >-
        Apps sind mit Vite gebaute Single-Page-Apps. Ein erstklassiger base-spa-Cloudflare-Worker ist für edge-natives
        statisches Hosting + SPA-Fallback enthalten, aber jeder statische Dateiserver funktioniert.
