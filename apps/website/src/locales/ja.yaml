faq:
  title: よくある質問
  items:
    affiliation:
      question: Mission Platform は他のプロジェクトと提携していますか?
      answer: いいえ。Mission Platform は独立したオープンソースのプロジェクトおよび組織であり、同じまたは類似の名前を持つ可能性のある他のプロジェクト、製品、企業、または組織と提携、推奨、関連付けされていません。
    composable:
      question: ここでの「コンポーザブル」とは具体的に何を意味しますか?
      answer: >-
        すべての機能 — コンポーネント、トークン、i18n、地図、スペルチェック —
        は、それぞれ独立してバージョン管理されたパッケージに収められています。モノリシックなフレームワークを採用するのではなく、必要なものだけを取り込み、自分のプロダクトを組み立てます。
    vue-version:
      question: どの Vue バージョンがサポートされていますか?
      answer: Composition API と `script setup` 構文を用いた Vue 3.5+。すべてのパッケージは TypeScript で書かれ、完全な型定義を提供します。
    deploy:
      question: Mission Platform のアプリはどのようにデプロイしますか?
      answer: >-
        アプリは Vite でビルドされたシングルページアプリです。エッジネイティブな静的 + SPA フォールバックホスティング用のファーストクラスの base-spa Cloudflare Worker
        が同梱されていますが、静的アセットを配信できるものなら何でも動作します。
