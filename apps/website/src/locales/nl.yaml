faq:
  title: Veelgestelde vragen
  items:
    affiliation:
      question: Is Mission Platform verbonden met een ander project?
      answer: >-
        Nee. Mission Platform is een onafhankelijk open-source project en organisatie, en is niet verbonden met,
        onderschreven door of geassocieerd met enig ander project, product, bedrijf of organisatie dat dezelfde of een
        vergelijkbare naam zou kunnen dragen.
    composable:
      question: Wat betekent «samen te stellen» hier eigenlijk?
      answer: >-
        Elke mogelijkheid — componenten, tokens, i18n, kaarten, spellingcontrole — leeft in een eigen geversioneerd
        pakket. Je trekt alleen binnen wat je nodig hebt en stelt je eigen product samen, in plaats van een monolithisch
        framework te adopteren.
    vue-version:
      question: Welke Vue-versie wordt ondersteund?
      answer: >-
        Vue 3.5+ met de Composition API en de `script setup`-syntaxis. Alle pakketten zijn geschreven in TypeScript en
        worden geleverd met volledige typedefinities.
    deploy:
      question: Hoe ontplooi ik een Mission Platform-app?
      answer: >-
        Apps zijn met Vite gebouwde single-page apps. Een eersteklas base-spa Cloudflare Worker is meegeleverd voor
        edge-native statische hosting met SPA-fallback, maar elke statische bestandsserver werkt.
