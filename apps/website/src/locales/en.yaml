faq:
  title: Frequently asked
  items:
    affiliation:
      question: Is Mission Platform affiliated with any other project?
      answer: >-
        No. Mission Platform is an independent open-source project and organisation, and is not affiliated with,
        endorsed by, or associated with any other project, product, company, or organisation that may share the same or
        a similar name.
    composable:
      question: What does “composable” actually mean here?
      answer: >-
        Every capability — components, tokens, i18n, maps, spell checking — lives in its own versioned package. You pull
        in only what you need and assemble your own product, instead of adopting a monolithic framework.
    vue-version:
      question: Which Vue version is supported?
      answer: >-
        Vue 3.5+ with the Composition API and the `script setup` syntax. All packages are written in TypeScript and ship
        full type definitions.
    deploy:
      question: How do I deploy a Mission Platform app?
      answer: >-
        Apps are Vite-built single-page apps. A first-class base-spa Cloudflare Worker is included for edge-native
        static + SPA fallback hosting, but anything that serves static assets works.
