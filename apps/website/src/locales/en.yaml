      composable:
        question: What does “composable” actually mean here?
        answer: >-
          Every capability — components, tokens, i18n, maps, spell checking — lives in its own versioned package. Pull
          in only what you need and assemble your own product instead of adopting a monolithic framework.
      vue-version:
        question: Which frameworks are supported?
        answer: >-
          Components are authored once in a framework-neutral JSX dialect and compiled straight to native components for
          the framework of your choice — no per-framework rewrites. Every package is written in TypeScript and ships
          full type definitions.
      deploy:
        question: How do I deploy a Mission Platform app?
        answer: >-
