  faq:
    title: Frequently asked
    items:
      affiliation:
        question: Is Mission Platform affiliated with any other project?
        answer: >-
          No. Mission Platform is an independent open-source project and organisation. It is not affiliated with,
          endorsed by, or associated with any other project, product, company, or organisation that may share the same
