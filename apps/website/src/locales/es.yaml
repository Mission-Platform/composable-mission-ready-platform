faq:
  title: Preguntas frecuentes
  items:
    affiliation:
      question: ¿Está Mission Platform afiliada con algún otro proyecto?
      answer: >-
        No. Mission Platform es un proyecto y una organización open-source independientes, y no está afiliada,
        respaldada ni asociada con ningún otro proyecto, producto, empresa u organización que pueda compartir el mismo
        nombre o uno similar.
    composable:
      question: ¿Qué significa realmente «componible» aquí?
      answer: >-
        Cada capacidad — componentes, tokens, i18n, mapas, corrección ortográfica — vive en su propio paquete
        versionado. Solo importas lo que necesitas y ensamblas tu propio producto, en lugar de adoptar un marco
        monolítico.
    vue-version:
      question: ¿Qué versión de Vue es compatible?
      answer: >-
        Vue 3.5+ con la Composition API y la sintaxis `script setup`. Todos los paquetes están escritos en TypeScript y
        ofrecen definiciones de tipos completas.
    deploy:
      question: ¿Cómo despliego una aplicación Mission Platform?
      answer: >-
        Las aplicaciones son SPA construidas con Vite. Se incluye un Cloudflare Worker base-spa de primera clase para
        alojamiento estático + respaldo SPA nativo del edge, pero cualquier servidor de archivos estáticos funciona.
