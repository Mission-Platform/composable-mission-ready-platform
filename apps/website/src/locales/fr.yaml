faq:
  title: Questions fréquentes
  items:
    affiliation:
      question: Mission Platform est-il affilié à un autre projet ?
      answer: >-
        Non. Mission Platform est un projet et une organisation open-source indépendants, et n’est ni affilié, ni
        soutenu, ni associé à un autre projet, produit, entreprise ou organisation pouvant porter un nom identique ou
        similaire.
    composable:
      question: Que signifie vraiment « composable » ici ?
      answer: >-
        Chaque fonctionnalité — composants, jetons, i18n, cartes, correction orthographique — vit dans son propre paquet
        versionné. Vous n’importez que ce dont vous avez besoin et assemblez votre propre produit, au lieu d’adopter un
        cadre monolithique.
    vue-version:
      question: Quelle version de Vue est prise en charge ?
      answer: >-
        Vue 3.5+ avec la Composition API et la syntaxe `script setup`. Tous les paquets sont écrits en TypeScript et
        fournissent des définitions de types complètes.
    deploy:
      question: Comment déployer une application Mission Platform ?
      answer: >-
        Les applications sont des SPA construites avec Vite. Un Cloudflare Worker base-spa de premier ordre est inclus
        pour un hébergement statique + repli SPA natif au edge, mais tout serveur de fichiers statiques fonctionne.
