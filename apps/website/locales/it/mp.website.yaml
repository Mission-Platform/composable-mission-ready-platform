about:
  lead: 'Mission Platform è un monorepo componibile di blocchi di interfaccia riutilizzabili, moduli WebAssembly e strumenti: progetta una volta sola in Forge e compila per ogni framework.'
  projects:
    aria-label: 'Elenco dei progetti'
  title: 'Informazioni'
ai_translation_warning: 'ai-translation-warning'
faq:
  items:
    composable:
      answer: "Costruiamo l'interfaccia a partire da piccoli blocchi riutilizzabili e indipendenti dal framework che puoi combinare a piacere."
      question: "Cosa significa 'componibile'?"
    deploy:
      answer: 'La piattaforma è progettata per essere distribuita su Cloudflare Workers e altri ambienti di hosting serverless o statici.'
      question: 'Come si distribuisce questo progetto?'
    frameworks:
      answer: "I componenti vengono progettati una volta sola nell'ambiente di runtime Forge, indipendente dal framework, e compilati per Vue, React, Svelte, Solid e Web Components."
      question: 'Quali framework sono supportati?'
  title: 'FAQ'
