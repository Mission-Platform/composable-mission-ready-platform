    jsx: 'Ambiente di runtime JSX indipendente dal framework con adattatori per ogni framework.'
    layouts: 'Layout applicativi a scrittura unica.'
    map: 'Componenti e composable per mappe MapLibre GL.'
    matrix-code: 'Codificatore e decodificatore Data Matrix in WebAssembly.'
    observers: 'Hook a scrittura unica per gli observer Intersection, Mutation e Performance.'
