faq:
  items:
    composable:
      answer: Costruiamo l'interfaccia a partire da piccoli blocchi riutilizzabili e indipendenti dal framework che puoi combinare a piacere.
      question: Cosa significa 'componibile'?
    deploy:
      answer: La piattaforma è progettata per essere distribuita su Cloudflare Workers e altri ambienti di hosting serverless o statici.
      question: Come si distribuisce questo progetto?
    frameworks:
      answer: I componenti vengono progettati una volta sola nell'ambiente di runtime Forge, indipendente dal framework, e compilati per Vue, React, Svelte, Solid e Web Components.
      question: Quali framework sono supportati?
features:
  barcode:
    description: Genera e scansiona codici QR, Data Matrix e codici a barre 1D, con la potenza di WebAssembly.
    title: Scansione e codici
  composable:
    description: Progetta la tua interfaccia una volta sola nell'ambiente di runtime Forge, indipendente dal framework, poi compilala per Vue, React, Svelte, Solid e Web Components.
    title: Scrivi una volta, esegui ovunque
  debugging:
    description: TypeScript end-to-end in ogni package, app e worker.
    title: Sicurezza dei tipi
  global:
    description: Progettato per essere distribuito su Cloudflare Workers e altre piattaforme serverless.
    title: Pronto per l'edge
  i18n:
    description: Traduzione integrata con i18next e pieno supporto per le lingue da destra a sinistra.
    title: Internazionalizzazione
  performance:
    description: Rust e AssemblyScript compilati in WebAssembly per una velocità quasi nativa.
    title: Prestazioni
  search:
    description: Moduli, tabelle, pianificazione, mappe, grafici e modifica di testo formattato, pronti all'uso.
    title: Tutto incluso
  theming:
    description: Token di design e temi SCSS con modalità chiara e scura di prima classe.
    title: Personalizzazione dei temi
packages:
  items:
    barcode: Codificatore e decodificatore di codici a barre 1D in WebAssembly.
    breakpoints: Utility e componenti per i breakpoint responsive.
    code-scanner: Scansiona codici QR, Data Matrix e codici a barre da un'immagine o dalla fotocamera.
    components: Componenti di interfaccia a scrittura unica per ogni framework supportato.
    content: AST dei contenuti, builder e componenti Monaco, Markdown e WYSIWYG.
    d3: Integrazione di D3 indipendente dal framework.
    email-components: Componenti compatibili con i client email per tutti i framework supportati.
    email-renderer: Rendering indipendente dal framework per email, Markdown e alberi Forge.
    forms: Generatore di moduli a scrittura unica e moduli guidati da schema.
    forms-core: Motore di moduli JSON Schema indipendente dal framework.
    harper: Controllo grammaticale e stilistico Harper per Monaco.
    hunspell: Controllo ortografico Hunspell in WebAssembly.
    i18n: Internazionalizzazione con la potenza di i18next.
    icons: Icone SVG progettate una volta sola in JSX.
    jsx: Ambiente di runtime JSX indipendente dal framework con adattatori per ogni framework.
    layouts: Layout applicativi a scrittura unica.
    map: Componenti e composable per mappe MapLibre GL.
    matrix-code: Codificatore e decodificatore Data Matrix in WebAssembly.
    observers: Hook a scrittura unica per gli observer Intersection, Mutation e Performance.
    phone-number: Analisi, validazione e formattazione dei numeri di telefono.
    qr-code: Codificatore e decodificatore di codici QR in WebAssembly.
    resource-planner: Pianificazione delle risorse indipendente dal framework e timeline per più persone.
    router: Utility di routing.
    rxjs: Collega gli observable RxJS allo stato dei componenti.
    scheduler: UI di pianificazione, eventi iCalendar e motore delle ricorrenze.
    seo: Dati strutturati, meta tag e utility per la sitemap.
    speech-audio: Hook per sintesi vocale, riconoscimento, audio e Web MIDI.
    three: Integrazione di Three.js indipendente dal framework.
    tokens: Token di design CSS e temi SCSS.
    vcard: Dati vCard RFC 6350, iCalendar RFC 5545 e componenti Forge.
projects:
  items:
    docs:
      cta: Leggi la documentazione
      description: Il sito pubblico della documentazione per imparare, costruire e distribuire con Mission Platform.
      name: Mission Platform Docs
    my-care-notes:
      cta: Scopri di più
      description: Un'applicazione di note di assistenza incentrata sul paziente, costruita su Mission Platform.
      name: My Care Notes
    service-monitor:
      cta: Scopri di più
      description: Una dashboard di monitoraggio dei servizi lato server, con probe Durable Object, serie temporali SQLite e grafici RxJS e D3 in tempo reale.
      name: Service Monitor
seo:
  description: Un monorepo open source e componibile per UI indipendenti dal framework, utility di dominio e prodotti web pronti per l’edge.
  keywords: Mission Platform, architettura componibile, UI indipendente dal framework, Forge, Vue, React, Svelte, Solid, Web Components, TypeScript, WebAssembly, Cloudflare Workers
  title: Mission Platform — Costruisci con coraggio. Pubblica con uno scopo.
  twitter-description: Componi i blocchi per prodotti web affidabili e pubblicali ovunque si trovino i tuoi utenti.
