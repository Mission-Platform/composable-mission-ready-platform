faq:
  items:
    composable:
      answer: אנו בונים את הממשק מאבני בניין קטנות, ניתנות לשימוש חוזר וניטרליות למסגרת עבודה, שאותן אפשר לשלב ולהתאים כרצונכם.
      question: מה המשמעות של רכיבי (composable)?
    deploy:
      answer: הפלטפורמה תוכננה לפריסה אל Cloudflare Workers ואל סביבות אירוח נטולות שרת או סטטיות נוספות.
      question: כיצד לפרוס את זה?
    frameworks:
      answer: הרכיבים נכתבים פעם אחת בסביבת הריצה Forge הניטרלית למסגרות עבודה, ונבנים עבור Vue, React, Svelte, Solid ו־Web Components.
      question: אילו מסגרות עבודה נתמכות?
features:
  barcode:
    description: צרו וסרקו ברקודים מסוג QR, Data Matrix וברקודים חד־ממדיים, המופעלים באמצעות WebAssembly.
    title: סריקה וקודים
  composable:
    description: כתבו את הממשק שלכם פעם אחת בסביבת הריצה Forge הניטרלית למסגרות עבודה, ואז בנו עבור Vue, React, Svelte, Solid ו־Web Components.
    title: כתבו פעם אחת, הריצו בכל מקום
  debugging:
    description: TypeScript מקצה לקצה בכל חבילה, אפליקציה ו־worker.
    title: בטוח מבחינת טיפוסים
  global:
    description: נבנתה לפריסה אל Cloudflare Workers ואל פלטפורמות נטולות שרת נוספות.
    title: מוכן לקצה
  i18n:
    description: תרגום מובנה באמצעות i18next עם תמיכה מלאה בשפות מימין לשמאל.
    title: בינאום
  performance:
    description: Rust ו־AssemblyScript מהודרים ל־WebAssembly למהירות קרובה למקורית.
    title: ביצועים
  search:
    description: טפסים, טבלאות, תזמון, מפות, תרשימים ועריכת טקסט עשיר, מוכנים לשימוש מיידי.
    title: הכול כלול
  theming:
    description: אסימוני עיצוב וערכות נושא ב־SCSS עם תמיכה מהשורה הראשונה במצב בהיר וכהה.
    title: עיצוב ערכות נושא
packages:
  items:
    barcode: מקודד ומפענח ברקודים חד־ממדיים ב־WebAssembly.
    breakpoints: כלים ורכיבים לנקודות שבירה רספונסיביות.
    code-scanner: סרקו ברקודים מסוג QR, Data Matrix וברקודים מתמונה או ממצלמה.
    components: רכיבי ממשק משתמש בכתיבה חד־פעמית עבור כל מסגרת עבודה נתמכת.
    content: AST תוכן, בונים ורכיבי Monaco, Markdown ו־WYSIWYG.
    d3: שילוב D3 ניטרלי למסגרות עבודה.
    email-components: רכיבים תואמי לקוחות דוא״ל המוצגים בכל המסגרות הנתמכות.
    email-renderer: רינדור ניטרלי למסגרות עבודה של דוא״ל, Markdown ועצי Forge.
    forms: בונה טפסים בכתיבה חד־פעמית וטפסים מונחי סכימה.
    forms-core: מנוע טפסים של JSON Schema הניטרלי למסגרות עבודה.
    harper: בדיקת דקדוק וסגנון של Harper עבור Monaco.
    hunspell: בדיקת איות של Hunspell ב־WebAssembly.
    i18n: בינאום המופעל באמצעות i18next.
    icons: אייקוני SVG הנכתבים פעם אחת ב־JSX.
    jsx: סביבת ריצה של JSX ניטרלית למסגרות עבודה עם מתאמים לכל מסגרת.
    layouts: פריסות אפליקציה בכתיבה חד־פעמית.
    map: רכיבים ו־composables של מפות MapLibre GL.
    matrix-code: מקודד ומפענח Data Matrix ב־WebAssembly.
    observers: הוקים של צופי Intersection, Mutation ו־Performance בכתיבה חד־פעמית.
    phone-number: ניתוח, אימות ועיצוב של מספרי טלפון.
    qr-code: מקודד ומפענח QR Code ב־WebAssembly.
    resource-planner: תכנון משאבים ניטרלי למסגרות עבודה ורכיבי ציר זמן לכמה אנשים.
    router: כלי ניתוב.
    rxjs: גישור בין observables של RxJS למצב הרכיב.
    scheduler: ממשק תזמון, אירועי iCalendar ומנוע חזרתיות.
    seo: נתונים מובנים, תגי מטא וכלי עזר למפת אתר.
    speech-audio: הוקים לסינתזת דיבור, זיהוי דיבור, שמע ו־Web MIDI.
    three: שילוב Three.js ניטרלי למסגרות עבודה.
    tokens: אסימוני עיצוב של CSS וערכות נושא של SCSS.
    vcard: נתוני vCard לפי RFC 6350, נתוני iCalendar לפי RFC 5545 ורכיבי Forge.
projects:
  items:
    docs:
      cta: לקריאת התיעוד
      description: אתר התיעוד הציבורי ללמידה, לבנייה ולהשקה עם Mission Platform.
      name: Mission Platform Docs
    my-care-notes:
      cta: למידע נוסף
      description: אפליקציית רשומות טיפול ממוקדת מטופל הבנויה על גבי ה־Mission Platform.
      name: My Care Notes
    service-monitor:
      cta: למידע נוסף
      description: לוח בקרה לניטור שירותים בצד השרת, עם בדיקות Durable Object, סדרות זמן ב-SQLite ותרשימי RxJS ו-D3 חיים.
      name: Service Monitor
seo:
  description: מונוריפו ניתן להרכבה בקוד פתוח לממשק ניטרלי למסגרות עבודה, כלי דומיין ומוצרי ווב מוכנים לקצה.
  keywords: Mission Platform, ארכיטקטורה ניתנת להרכבה, ממשק ניטרלי למסגרות עבודה, Forge, Vue, React, Svelte, Solid, Web Components, TypeScript, WebAssembly, Cloudflare Workers
  title: Mission Platform — בנו באומץ. השיקו בכוונה.
  twitter-description: הרכיבו אבני בניין למוצרי ווב אמינים והשיקו אותם בכל מקום שבו המשתמשים שלכם נמצאים.
