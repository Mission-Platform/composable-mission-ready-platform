about:
  lead: 'ה־Mission Platform היא מונו־ריפו רכיבי (composable) של אבני בניין לממשק משתמש הניתנות לשימוש חוזר, מודולי WebAssembly וכלים — כתבו פעם אחת ב־Forge ובנו עבור כל מסגרת עבודה.'
  projects:
    aria-label: 'רשימת פרויקטים'
  title: 'אודות'
ai_translation_warning: 'ai-translation-warning'
faq:
  items:
    composable:
      answer: 'אנו בונים את הממשק מאבני בניין קטנות, ניתנות לשימוש חוזר וניטרליות למסגרת עבודה, שאותן אפשר לשלב ולהתאים כרצונכם.'
      question: 'מה המשמעות של רכיבי (composable)?'
    deploy:
      answer: 'הפלטפורמה תוכננה לפריסה אל Cloudflare Workers ואל סביבות אירוח נטולות שרת או סטטיות נוספות.'
      question: 'כיצד לפרוס את זה?'
    frameworks:
      answer: 'הרכיבים נכתבים פעם אחת בסביבת הריצה Forge הניטרלית למסגרות עבודה, ונבנים עבור Vue, React, Svelte, Solid ו־Web Components.'
      question: 'אילו מסגרות עבודה נתמכות?'
  title: 'שאלות נפוצות'
