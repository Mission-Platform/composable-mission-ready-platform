about:
  lead: 'إن Mission Platform عبارة عن مستودع أحادي قابل للتركيب يضم لبنات بناء واجهة مستخدم قابلة لإعادة الاستخدام ووحدات WebAssembly وأدوات — اكتب مرة واحدة في Forge وابنِ لكل إطار عمل.'
  projects:
