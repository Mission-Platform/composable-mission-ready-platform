faq:
  items:
    composable:
      answer: Construimos la interfaz a partir de bloques pequeños, reutilizables e independientes del framework que puedes combinar a tu gusto.
      question: '¿Qué significa ''componible''?'
    deploy:
      answer: La plataforma está diseñada para desplegarse en Cloudflare Workers y en otros entornos de alojamiento sin servidor o estáticos.
      question: '¿Cómo despliego esto?'
    frameworks:
      answer: Los componentes se crean una sola vez en el entorno de ejecución Forge, independiente del framework, y se compilan para Vue, React, Svelte, Solid y Web Components.
      question: '¿Qué frameworks son compatibles?'
features:
  barcode:
    description: Genera y escanea códigos QR, Data Matrix y códigos de barras 1D, con la potencia de WebAssembly.
    title: Escaneo y códigos
  composable:
    description: Crea tu interfaz una sola vez en el entorno de ejecución Forge, independiente del framework, y compílala para Vue, React, Svelte, Solid y Web Components.
    title: Escríbelo una vez, ejecútalo en todas partes
  debugging:
    description: TypeScript de extremo a extremo en cada paquete, aplicación y worker.
    title: Con tipado seguro
  global:
    description: Diseñado para desplegarse en Cloudflare Workers y otras plataformas sin servidor.
    title: Listo para el edge
  i18n:
    description: Traducción integrada con i18next y compatibilidad total con idiomas de derecha a izquierda.
    title: Internacionalización
  performance:
    description: Rust y AssemblyScript compilados a WebAssembly para una velocidad casi nativa.
    title: Rendimiento
  search:
    description: Formularios, tablas, programación, mapas, gráficos y edición de texto enriquecido listos para usar.
    title: Todo incluido
  theming:
    description: Tokens de diseño y temas SCSS con modos claro y oscuro de primer nivel.
    title: Personalización de temas
packages:
  items:
    barcode: Codificador y decodificador de códigos de barras 1D en WebAssembly.
    breakpoints: Utilidades y componentes de puntos de ruptura adaptables.
    code-scanner: Escanea códigos QR, Data Matrix y códigos de barras desde una imagen o la cámara.
    components: Componentes de interfaz de escritura única para cada framework compatible.
    content: AST de contenido, constructores y componentes Monaco, Markdown y WYSIWYG.
    d3: Integración de D3 independiente del framework.
    email-components: Componentes compatibles con clientes de correo para todos los frameworks admitidos.
    email-renderer: Renderizado independiente del framework para correo, Markdown y árboles Forge.
    forms: Creador de formularios de escritura única y formularios basados en esquemas.
    forms-core: Motor de formularios JSON Schema independiente del framework.
    harper: Comprobación gramatical y de estilo de Harper para Monaco.
    hunspell: Corrección ortográfica con Hunspell en WebAssembly.
    i18n: Internacionalización con la potencia de i18next.
    icons: Iconos SVG creados una sola vez en JSX.
    jsx: Entorno de ejecución JSX independiente del framework con adaptadores para cada framework.
    layouts: Diseños de aplicación de escritura única.
    map: Componentes y composables de mapas MapLibre GL.
    matrix-code: Codificador y decodificador de Data Matrix en WebAssembly.
    observers: Hooks de observadores Intersection, Mutation y Performance de escritura única.
    phone-number: Análisis, validación y formato de números de teléfono.
    qr-code: Codificador y decodificador de códigos QR en WebAssembly.
    resource-planner: Planificación de recursos independiente del framework y líneas de tiempo para varias personas.
    router: Utilidades de enrutamiento.
    rxjs: Conecta observables de RxJS con el estado de los componentes.
    scheduler: Interfaz de planificación, eventos iCalendar y motor de recurrencia.
    seo: Datos estructurados, metaetiquetas y utilidades de sitemap.
    speech-audio: Hooks de síntesis de voz, reconocimiento, audio y Web MIDI.
    three: Integración de Three.js independiente del framework.
    tokens: Tokens de diseño CSS y temas SCSS.
    vcard: Datos vCard RFC 6350, iCalendar RFC 5545 y componentes Forge.
projects:
  items:
    docs:
      cta: Leer la documentación
      description: El sitio público de documentación para aprender, construir y publicar con Mission Platform.
      name: Mission Platform Docs
    my-care-notes:
      cta: Más información
      description: Una aplicación de notas de atención centrada en el paciente, construida sobre Mission Platform.
      name: My Care Notes
    service-monitor:
      cta: Más información
      description: Un panel de monitorización de servicios en el servidor, con sondas Durable Object, series temporales SQLite y gráficos en vivo con RxJS y D3.
      name: Service Monitor
seo:
  description: Un monorepo de código abierto y componible para UI independiente del framework, utilidades de dominio y productos web preparados para el edge.
  keywords: Mission Platform, arquitectura componible, UI independiente del framework, Forge, Vue, React, Svelte, Solid, Web Components, TypeScript, WebAssembly, Cloudflare Workers
  title: Mission Platform — Construye con valentía. Publica con propósito.
  twitter-description: Combina bloques para productos web fiables y publícalos donde estén tus usuarios.
