faq:
  items:
    composable:
      answer: '小さく再利用可能でフレームワークに依存しないビルディングブロックからインターフェースを構築し、自由に組み合わせられます。'
      question: "'コンポーザブル（composable）' とはどういう意味ですか？"
    deploy:
      answer: 'このプラットフォームは、Cloudflare Workers をはじめとするサーバーレスや静的ホスティング環境へのデプロイを想定して設計されています。'
      question: 'どうやってデプロイしますか？'
    frameworks:
      answer: 'コンポーネントはフレームワークに依存しない Forge ランタイムで一度記述し、Vue、React、Svelte、Solid、Web Components 向けにビルドされます。'
      question: 'どのフレームワークに対応していますか？'
  title: 'よくある質問'
