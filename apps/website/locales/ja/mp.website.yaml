about:
  lead: 'Mission Platform は、再利用可能な UI ビルディングブロック、WebAssembly モジュール、ツール群で構成されたコンポーザブルなモノレポです。Forge で一度記述すれば、あらゆるフレームワーク向けにビルドできます。'
