faq:
  items:
    composable:
      answer: We bouwen de interface op uit kleine, herbruikbare, framework-neutrale bouwstenen die je naar wens kunt combineren.
      question: Wat betekent 'composable'?
    deploy:
      answer: Het platform is ontworpen om te deployen naar Cloudflare Workers en andere serverless of statische hostingomgevingen.
      question: Hoe deploy ik dit?
    frameworks:
      answer: Componenten worden één keer geschreven in de framework-onafhankelijke Forge-runtime en gebouwd voor Vue, React, Svelte, Solid en Web Components.
      question: Welke frameworks worden ondersteund?
features:
  barcode:
    description: Genereer en scan QR, Data Matrix en 1D-barcodes, aangedreven door WebAssembly.
    title: Scannen & codes
  composable:
    description: Schrijf je UI één keer in de framework-onafhankelijke Forge-runtime en bouw daarna voor Vue, React, Svelte, Solid en Web Components.
    title: Eén keer schrijven, overal draaien
  debugging:
    description: End-to-end TypeScript in elk package, elke app en elke worker.
    title: Type-veilig
  global:
    description: Gebouwd om te deployen naar Cloudflare Workers en andere serverless platformen.
    title: Klaar voor de edge
  i18n:
    description: Ingebouwde i18next-vertaling met volledige ondersteuning voor talen van rechts naar links.
    title: Internationalisatie
  performance:
    description: Rust en AssemblyScript gecompileerd naar WebAssembly voor bijna-native snelheid.
    title: Prestaties
  search:
    description: Formulieren, tabellen, planning, kaarten, grafieken en rich-text-bewerking standaard aanwezig.
    title: Alles inbegrepen
  theming:
    description: Design tokens en SCSS-thema's met eersteklas lichte en donkere modi.
    title: Theming
packages:
