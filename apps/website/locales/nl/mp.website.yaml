faq:
  items:
    composable:
      answer: We bouwen de interface op uit kleine, herbruikbare, framework-neutrale bouwstenen die je naar wens kunt combineren.
      question: Wat betekent 'composable'?
    deploy:
      answer: Het platform is ontworpen om te deployen naar Cloudflare Workers en andere serverless of statische hostingomgevingen.
      question: Hoe deploy ik dit?
    frameworks:
      answer: Componenten worden één keer geschreven in de framework-onafhankelijke Forge-runtime en gebouwd voor Vue, React, Svelte, Solid en Web Components.
      question: Welke frameworks worden ondersteund?
features:
  barcode:
    description: Genereer en scan QR, Data Matrix en 1D-barcodes, aangedreven door WebAssembly.
    title: Scannen & codes
  composable:
    description: Schrijf je UI één keer in de framework-onafhankelijke Forge-runtime en bouw daarna voor Vue, React, Svelte, Solid en Web Components.
    title: Eén keer schrijven, overal draaien
  debugging:
    description: End-to-end TypeScript in elk package, elke app en elke worker.
    title: Type-veilig
  global:
    description: Gebouwd om te deployen naar Cloudflare Workers en andere serverless platformen.
    title: Klaar voor de edge
  i18n:
    description: Ingebouwde i18next-vertaling met volledige ondersteuning voor talen van rechts naar links.
    title: Internationalisatie
  performance:
    description: Rust en AssemblyScript gecompileerd naar WebAssembly voor bijna-native snelheid.
    title: Prestaties
  search:
    description: Formulieren, tabellen, planning, kaarten, grafieken en rich-text-bewerking standaard aanwezig.
    title: Alles inbegrepen
  theming:
    description: Design tokens en SCSS-thema's met eersteklas lichte en donkere modi.
    title: Theming
packages:
  items:
    barcode: 1D-barcode-encoder en -decoder in WebAssembly.
    breakpoints: Responsieve breakpoint-utilities en -componenten.
    code-scanner: Scan QR, Data Matrix en barcodes vanaf afbeelding of camera.
    components: Write-once UI-componenten voor elk ondersteund framework.
    content: Content-AST, builders, Monaco-, Markdown- en WYSIWYG-componenten.
    d3: Framework-neutrale D3-integratie.
    email-components: E-mailclient-compatibele componenten voor alle ondersteunde frameworks.
    email-renderer: Framework-neutrale rendering van e-mail, Markdown en Forge-bomen.
    forms: Write-once formulierbouwer en schema-gedreven formulieren.
    forms-core: Framework-onafhankelijke JSON Schema-formulierenengine.
    harper: Harper grammatica- en stijlcontrole voor Monaco.
    hunspell: Hunspell-spellingcontrole in WebAssembly.
    i18n: Internationalisatie aangedreven door i18next.
    icons: SVG-iconen één keer geschreven in JSX.
    jsx: Framework-neutrale JSX-runtime met adapters voor elk framework.
    layouts: Write-once applicatie-layouts.
    map: MapLibre GL kaartcomponenten en composables.
    matrix-code: Data Matrix-encoder en -decoder in WebAssembly.
    observers: Write-once Intersection-, Mutation- en Performance-observer-hooks.
    phone-number: Parsen, valideren en formatteren van telefoonnummers.
    qr-code: QR Code-encoder en -decoder in WebAssembly.
    resource-planner: Framework-neutrale resourceplanning en tijdlijnen voor meerdere personen.
    router: Routing-utilities.
    rxjs: Koppel RxJS-observables aan componentstatus.
    scheduler: Scheduler-UI, iCalendar-events en herhalingsengine.
    seo: Gestructureerde data, meta-tags en sitemap-helpers.
    speech-audio: Spraaksynthese, -herkenning, audio- en Web MIDI-hooks.
    three: Framework-neutrale Three.js-integratie.
    tokens: CSS design tokens en SCSS-thema's.
    vcard: RFC 6350 vCard- en RFC 5545 iCalendar-data en Forge-componenten.
projects:
  items:
    docs:
      cta: Documentatie lezen
      description: De openbare documentatiesite om te leren, bouwen en leveren met Mission Platform.
      name: Mission Platform Docs
    my-care-notes:
      cta: Meer informatie
      description: Een patiëntgerichte zorgnotitie-applicatie gebouwd op het Mission Platform.
      name: My Care Notes
    service-monitor:
      cta: Meer informatie
      description: Een server-side dashboard voor servicemonitoring met Durable Object-probes, SQLite-tijdreeksen en live RxJS- en D3-grafieken.
      name: Service Monitor
seo:
  description: Een open-source, composable monorepo voor framework-neutrale UI, domeinutilities en edge-klare webproducten.
  keywords: Mission Platform, composable architectuur, framework-neutrale UI, Forge, Vue, React, Svelte, Solid, Web Components, TypeScript, WebAssembly, Cloudflare Workers
  title: Mission Platform — Bouw moedig. Lever met een doel.
  twitter-description: Stel betrouwbare webproducten samen uit bouwstenen en lever ze waar je gebruikers zijn.
