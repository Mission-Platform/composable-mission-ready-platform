    harper: Harper grammatica- en stijlcontrole voor Monaco.
    hunspell: Hunspell-spellingcontrole in WebAssembly.
    i18n: Internationalisatie aangedreven door i18next.
    icons: SVG-iconen één keer geschreven in JSX.
