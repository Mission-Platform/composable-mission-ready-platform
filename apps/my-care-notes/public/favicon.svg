<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Notebook/notes page background -->
  <rect x="6" y="3" width="20" height="26" rx="3" ry="3" fill="#e8f4f8" stroke="#4a9ebe" stroke-width="1.5"/>
  <!-- Spiral binding dots -->
  <circle cx="16" cy="3" r="1.5" fill="#4a9ebe"/>
  <circle cx="10" cy="3" r="1.5" fill="#4a9ebe"/>
  <circle cx="22" cy="3" r="1.5" fill="#4a9ebe"/>
  <!-- Text lines on the note -->
  <line x1="10" y1="12" x2="22" y2="12" stroke="#b0cfd9" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="16" x2="22" y2="16" stroke="#b0cfd9" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="20" x2="18" y2="20" stroke="#b0cfd9" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Care / heart icon -->
  <path
    d="M16 9.5 C16 9.5 13 7 11.5 8.5 C10 10 11.5 12 13 13 L16 15 L19 13 C20.5 12 22 10 20.5 8.5 C19 7 16 9.5 16 9.5Z"
