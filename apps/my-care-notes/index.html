<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=2.0, viewport-fit=cover"
      name="viewport"
    />
    <!-- Advertise that the document supports both schemes so the UA chrome
         (scrollbars, form controls, address bar) renders correctly before the
         app's CSS/JS loads. -->
    <meta
      content="light dark"
      name="color-scheme"
    />
    <!-- Pre-paint theme init: resolves the persisted preference and pins
         data-theme/color-scheme on <html> synchronously, before the stylesheet
         and app bundle load, so the first paint matches the saved theme (no
         flash). Mirrors @mission-platform/components' themeInitScript(). -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var t = localStorage.getItem('mp-theme') || 'auto';
          if (t === 'light' || t === 'dark') {
            d.setAttribute('data-theme', t);
            d.style.colorScheme = t;
          } else {
            d.removeAttribute('data-theme');
            d.style.colorScheme = 'light dark';
          }
        } catch (e) {}
      })();
    </script>
    <meta
      content="#4a9ebe"
      name="theme-color"
    />
    <meta
      content="A clinical notes editor that works offline"
      name="description"
    />
    <meta
      content="yes"
      name="mobile-web-app-capable"
    />
    <meta
      content="yes"
      name="apple-mobile-web-app-capable"
    />
    <meta
      content="default"
      name="apple-mobile-web-app-status-bar-style"
    />
    <meta
      content="Care Notes"
      name="apple-mobile-web-app-title"
    />
    <link
      href="/favicon.svg"
      rel="icon"
      type="image/svg+xml"
    />
    <link
      href="/pwa-192x192.png"
      rel="apple-touch-icon"
    />
    <title>My Care Notes</title>
  </head>
  <body>
    <div id="app"></div>
    <script
      src="/src/main.ts"
      type="module"
    ></script>
  </body>
</html>
